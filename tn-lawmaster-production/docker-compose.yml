version: '3.8'
services:
  tn-lawmaster-api:
    build: .
    container_name: tn-lawmaster-prod
    restart: unless-stopped
    environment:
      - ENVIRONMENT=production
      - GROQ_API_KEY=${GROQ_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - tn-lawmaster-network
  nginx:
    image: nginx:alpine
    container_name: tn-lawmaster-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - tn-lawmaster-api
    networks:
      - tn-lawmaster-network
networks:
  tn-lawmaster-network:
    driver: bridge